name: Checks and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The checks job runs third-party code, so only the deploy job gets Pages rights.
permissions:
  contents: read

# One queue per branch: pull requests don't wait on deploys, and main deploys in push order.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The ruleset requires this job by its id: keep it named `checks`.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Before verify: its build writes src/lib/paraglide, which svelte-check needs.
      - run: npm run test:e2e
      - run: npm run verify
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
